[platformio]
default_envs = esp32dev

[env:esp32dev]
; EspBle needs Arduino-ESP32 3.2.0+ on the original ESP32.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  https://github.com/tanakamasayuki/EspBle.git#ef09bedf2bf0cdd9d0da10757f9801b417821375
  bblanchon/ArduinoJson@^7.0.4
  links2004/WebSockets@^2.4.1
