; ESP32-WROOM-32 using Arduino core 2.x for BLE Keyboard compatibility
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  t-vk/ESP32 BLE Keyboard@^0.3.2
  bblanchon/ArduinoJson@^7.0.4
  links2004/WebSockets@^2.4.1
