name: Temporary lockfile bootstrap

on:
  push:
    branches:
      - feature/monorepo-control-plane

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only
      - name: Emit lockfile for repository commit
        run: python3 -c 'import base64; print("LOCKFILE_BASE64=" + base64.b64encode(open("pnpm-lock.yaml", "rb").read()).decode())'
