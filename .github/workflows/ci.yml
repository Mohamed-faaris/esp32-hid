name: Monorepo CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test signed OTA manifest tooling
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate Python test and hardware scripts
        run: python -m py_compile scripts/create_ota_manifest.py scripts/test_create_ota_manifest.py scripts/ble-host-verify.py
      - name: Validate Linux hardware smoke script
        run: node --check scripts/hardware-smoke-test.mjs
      - name: Build web
        run: pnpm --filter @esp32-hid/web build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Write disposable build credentials
        run: |
          printf '%s\n' 'ESP32_API_SECRET=ci-only-secret-not-for-devices-0123456789abcdef' 'ESP32_AP_PASSWORD=ci-only-password' > .env
      - name: Install pioarduino Core 6.2.0
        run: pipx install pioarduino==6.2.0
      - name: Build firmware
        run: pnpm firmware:build
